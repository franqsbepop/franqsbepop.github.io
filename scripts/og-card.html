<!DOCTYPE html>
<!-- Social preview card (Open Graph / Twitter), rendered to images/og/default.jpg
     by `scripts/assets.sh og`. Uses the site's own fonts and portrait. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); display: grid; grid-template-columns: 1fr 420px; }
  .text { padding: 72px 64px 64px 80px; display: flex; flex-direction: column; }
  .label { font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .label b { color: var(--accent); font-weight: 500; }
  .name { margin-top: 28px; font-size: 34px; font-weight: 600; color: var(--ink); letter-spacing: -0.015em; }
  .role { margin-top: 6px; font-size: 22px; color: var(--muted); line-height: 1.4; }
  .headline { margin-top: auto; font-family: var(--serif); font-size: 76px; line-height: 1.02; letter-spacing: -0.024em; color: var(--navy); }
  .headline em { color: var(--slate); }
  .url { margin-top: 30px; font-family: var(--mono); font-size: 18px; color: var(--muted); }
  .photo { position: relative; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .rule { position: absolute; left: 80px; right: 64px; bottom: 0; height: 6px; background: var(--navy); }
</style>
</head>
<body>
  <div class="text">
    <p class="label"><b>01</b> / Mathematics</p>
    <p class="name">Diogo Sousa Franquinho</p>
    <p class="role">Joint PhD Candidate in Mathematics<br>Universidade de Lisboa · University of Amsterdam</p>
    <p class="headline">Understanding <em>uncertainty</em> through mathematics.</p>
    <p class="url">diogofranquinho.com</p>
  </div>
  <div class="photo"><img src="../images/profile/formal-portrait-840.jpg" alt=""></div>
</body>
</html>
