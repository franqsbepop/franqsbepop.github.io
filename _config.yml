title: Diogo Sousa Franquinho
description: Personal website of Diogo Sousa Franquinho
baseurl: "" # Leave empty for root
url: "https://diogofranquinho.com"
theme: jekyll-theme-primer

# The site is plain static HTML generated by `npm run build` (see README.md).
# GitHub Pages still runs Jekyll; these sources are not part of the website.
exclude:
  - src/
  - scripts/
  - node_modules/
  - vendor/
  - package.json
  - package-lock.json
  - tsconfig.json
  - README.md
  - CONTENT-TODO.md
  - Gemfile
  - Gemfile.lock
