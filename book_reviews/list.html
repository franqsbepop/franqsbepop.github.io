<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diogo Franquinho - Book Reviews">
    <title>Book Reviews - Diogo Franquinho</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/book-reviews.css">
</head>
<body>
    <header>
        <nav class="top-nav">
            <h2>
                <a href="../index.html#biography">Biography</a> | 
                <a href="../index.html#research">Research</a> | 
                <a href="../index.html#publications">Publications</a> | 
                <a href="../index.html#teaching">Teaching</a> | 
                <a href="../blog.html">Blog</a> | 
                <a href="../index.html#contact">Contact</a>
            </h2>
        </nav>
    </header>

    <main>
        <h1>Book Reviews</h1>
        <section id="book-list" class="book-list">
            <!-- Books will be loaded here -->
        </section>
    </main>

    <footer>
        <p>&copy; Diogo Franquinho | Book Reviews</p>
    </footer>

    <script>
        async function loadBooks() {
            try {
                // Use the full path to the CSV file
                const response = await fetch('../book_reviews/goodreads_library_export.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();
                const books = parseCSV(csvText);
                displayBooks(books);
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('book-list').innerHTML = 
                    `<p>Error loading books: ${error.message}. Please try again later.</p>`;
            }
        }

        function parseCSV(csvText) {
            try {
                const lines = csvText.split('\n');
                if (lines.length < 2) {
                    throw new Error('CSV file appears to be empty or malformed');
                }

                const headers = lines[0].split(',').map(header => header.trim());

                const books = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Handle quoted values containing commas
                    let values = [];
                    let currentValue = '';
                    let insideQuotes = false;
                    
                    for (let char of lines[i]) {
                        if (char === '"') {
                            insideQuotes = !insideQuotes;
                        } else if (char === ',' && !insideQuotes) {
                            values.push(currentValue);
                            currentValue = '';
                        } else {
                            currentValue += char;
                        }
                    }
                    values.push(currentValue); // Push the last value
                    
                    const book = {};
                    headers.forEach((header, index) => {
                        if (values[index]) {
                            // Clean up the value
                            let value = values[index].trim();
                            // Remove surrounding quotes and clean up escaped quotes
                            value = value.replace(/^["'](.*)["']$/, '$1').replace(/""/g, '"');
                            book[header] = value;
                        } else {
                            book[header] = '';
                        }
                    });
                    
                    books.push(book);
                }

                return books;
            } catch (error) {
                console.error('Error parsing CSV:', error);
                throw new Error('Failed to parse CSV file');
            }
        }

        function cleanISBN(raw) {
            // Goodreads exports ISBNs as Excel formulas: ="0123456789"
            return raw.replace(/^="?/, '').replace(/"?$/, '');
        }

        function displayBooks(books) {
            const container = document.getElementById('book-list');

            container.innerHTML = books.map(book => {
                const isbn = cleanISBN(book['ISBN'] || '');
                const additionalAuthors = book['Additional Authors'] || '';
                const authorLF = book['Author l-f'] || '';
                return `
                <article class="book-review">
                    <h2>${book['Title'] || 'Untitled'}</h2>
                    <p><strong>Author:</strong> ${book['Author'] || 'Unknown'}${authorLF ? ' (' + authorLF + ')' : ''}</p>
                    ${additionalAuthors ? `<p><strong>Additional Authors:</strong> ${additionalAuthors}</p>` : ''}
                    ${isbn ? `<p><strong>ISBN:</strong> ${isbn}</p>` : ''}
                    ${book['Publisher'] ? `<p><strong>Publisher:</strong> ${book['Publisher']}</p>` : ''}
                </article>`;
            }).join('');
        }

        // Load books when the page loads
        document.addEventListener('DOMContentLoaded', loadBooks);
    </script>
</body>
</html>
