    <main>
        <h1>Book Reviews (Coming Soon)</h1>
        <section id="book-list" class="book-list">
            <!-- Books will be loaded here -->
        </section>
    </main>

    <footer>
        <p>&copy; Diogo Franquinho | Book Reviews</p>
    </footer>

    <script>
        async function loadBooks() {
            try {
                // Use the full path to the CSV file
                const response = await fetch('../book_reviews/goodreads_library_export.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();
                const books = parseCSV(csvText);
                displayBooks(books, await loadCovers());
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('book-list').innerHTML = 
                    `<p>Error loading books: ${error.message}. Please try again later.</p>`;
            }
        }

        function parseCSV(csvText) {
            try {
                const lines = csvText.split('\n');
                if (lines.length < 2) {
                    throw new Error('CSV file appears to be empty or malformed');
                }

                const headers = lines[0].split(',').map(header => header.trim());

                const books = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Handle quoted values containing commas
                    let values = [];
                    let currentValue = '';
                    let insideQuotes = false;
                    
                    for (let char of lines[i]) {
                        if (char === '"') {
                            insideQuotes = !insideQuotes;
                        } else if (char === ',' && !insideQuotes) {
                            values.push(currentValue);
                            currentValue = '';
                        } else {
                            currentValue += char;
                        }
                    }
                    values.push(currentValue); // Push the last value
                    
                    const book = {};
                    headers.forEach((header, index) => {
                        if (values[index]) {
                            // Clean up the value
                            let value = values[index].trim();
                            // Remove surrounding quotes and clean up escaped quotes
                            value = value.replace(/^["'](.*)["']$/, '$1').replace(/""/g, '"');
                            book[header] = value;
                        } else {
                            book[header] = '';
                        }
                    });
                    
                    books.push(book);
                }

                return books;
            } catch (error) {
                console.error('Error parsing CSV:', error);
                throw new Error('Failed to parse CSV file');
            }
        }

        // Title -> image file, written by fetch_covers.py. Books without a
        // cover keep the empty placeholder slot.
        async function loadCovers() {
            try {
                const response = await fetch('covers/manifest.json');
                if (!response.ok) return {};
                // parseCSV drops double quotes inside titles, so key without them
                const covers = {};
                for (const [title, file] of Object.entries(await response.json())) {
                    covers[title.replace(/"/g, '')] = file;
                }
                return covers;
            } catch (error) {
                return {};
            }
        }

        function displayBooks(books, covers) {
            const container = document.getElementById('book-list');

            container.innerHTML = books.map(book => `
                <article class="book-review">
                    <h2>${book['Title'] || 'Untitled'}</h2>
                    <div class="book-cover" aria-hidden="true">${covers[book['Title']]
                        ? `<img src="covers/${encodeURIComponent(covers[book['Title']])}" alt="" loading="lazy">`
                        : ''}</div>
                    <p>${book['Author'] || 'Unknown'}</p>
                </article>`).join('');
        }

        // Load books when the page loads
        document.addEventListener('DOMContentLoaded', loadBooks);
    </script>
</body>
